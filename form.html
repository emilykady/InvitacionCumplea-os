<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirmar asistencia</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="invitation-container">
    <div class="card confirmation-card">
      <div class="content">
        <h1 class="titulo-confirmacion">Confirmar Asistencia</h1>
        <p class="subtitulo">Para la fiesta de 50 años</p>
        
      
        <form action="https://formspree.io/f/xdkwazby" method="POST" target="_blank" class="form-confirmacion" id="miFormulario">
          <div class="form-group">
            <label for="nombre">Tu nombre completo *</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingresa tu nombre" required>
          </div>
          
          <div class="form-group">
            <label for="email">Tu email (opcional)</label>
            <input type="email" id="email" name="email" placeholder="tu@email.com">
          </div>
          
    
          <div class="form-group">
            <label>Acompañantes (opcional)</label>
            <div id="guests-container" class="guests-container">
     
            </div>
            <button type="button" class="btn-anadir" onclick="addGuest()">
              <span>+</span> Añadir acompañante
            </button>
          </div>
          
          <div class="form-group">
            <label for="mensaje">Mensaje adicional (opcional)</label>
            <textarea id="mensaje" name="mensaje" placeholder="Alergias, preferencias, etc..." rows="2"></textarea>
          </div>
          
    
          <input type="hidden" name="_subject" value="🎉 Confirmación Fiesta 50 Años">
          <input type="text" name="_gotcha" style="display:none">
          
          <div class="botones-confirmacion">
            <button type="submit" class="btn confirmar enviar">Enviar confirmación</button>
            <a href="index.html" class="btn volver">Volver a la invitación</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>

    function addGuest() {
      const container = document.getElementById('guests-container');
      const guestCount = container.querySelectorAll('.guest-input').length;
      
      if (guestCount >= 4) {
        alert('Máximo 4 acompañantes permitidos');
        return;
      }
      
      const guestGroup = document.createElement('div');
      guestGroup.className = 'guest-group';
      
      guestGroup.innerHTML = `
        <div class="guest-input">
          <input type="text" name="acompanante[]" placeholder="Nombre del acompañante">
          <button type="button" class="remove-guest" onclick="this.parentElement.parentElement.remove()">✕</button>
        </div>
      `;
      
      container.appendChild(guestGroup);
    }


    document.getElementById('miFormulario').addEventListener('submit', function(e) {
      const submitBtn = this.querySelector('.enviar');
      submitBtn.innerHTML = 'Enviando...';
      submitBtn.disabled = true;
      
    
      const acompanantes = Array.from(document.querySelectorAll('input[name="acompanante[]"]'))
        .map(input => input.value.trim())
        .filter(val => val !== '')
        .join(', ');
      

      let hiddenField = document.querySelector('input[name="acompanantes"]');
      if (!hiddenField) {
        hiddenField = document.createElement('input');
        hiddenField.type = 'hidden';
        hiddenField.name = 'acompanantes';
        this.appendChild(hiddenField);
      }
      hiddenField.value = acompanantes;
      
    
      setTimeout(() => {
        window.location.href = 'agradec.html';
      }, 1000);
    });
  </script>
</body>
</html>
