<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitación 50 Años</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="invitation-container">
    <div class="card">
      <div class="content">
        <h1 class="invitado">ESTÁS INVITADO</h1>
        <h2 class="celebrar">A CELEBRAR CON NOSOTROS EL:</h2>
        <div class="numero-container">
          <div class="numero">50</div>
          <div class="efecto-brillo"></div>
        </div>
        <h3 class="fiesta">Cumpleaños de</h3>
         <div class="numero-nomb">Noelia Velazco</div>
        <div class="details">
          <div class="detail-item">
           
            <span class="text">4 de Octubre</span>
          </div>
          <div class="detail-item">
        
            <span class="text">16:00 PM</span>
          </div>
          <div class="detail-item">
        
            <span class="text">Calle Caceres 12, 1B</span>
          </div>
        </div>
        
        <div class="buttons">
          <a href="https://maps.app.goo.gl/k3xNagCqXVjv92Tn7" class="btn ubicacion">Ver ubicación</a>
          <a href="form.html" class="btn confirmar">Confirmar asistencia</a>
        </div>
        
        <div class="decoracion">
          <div class="confeti confeti-1"></div>
          <div class="confeti confeti-2"></div>
          <div class="confeti confeti-3"></div>
          <div class="confeti confeti-4"></div>
          <div class="confeti confeti-5"></div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
